<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relieve y riesgos · Temas 3 y 4</title>
<meta name="author" content="María Dolores Gámez Ortiz">
<link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #071318; --bg2: #0d2229; --panel: #0f2930; --panel2: #15353d;
    --line: rgba(150, 220, 230, .22); --ink: #f1fbff; --muted: #bcd6dc;
    --magma: #1fa2c4; --lava: #f6c344; --ember: #3fbf7f; --sea: #2ec4b6;
    --ok: #34d399; --bad: #ff4d6d; --rock: #8d6e63;
    --radius: 22px; --shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: clamp(17px, 0.9vw + 9px, 26px); background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); overflow-x: hidden;
    font-family: "Nunito", "Segoe UI", sans-serif; line-height: 1.35;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(31,162,196,.25), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(63,191,127,.14), transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg));
    background-attachment: fixed;
  }
  h1, h2, h3, .display { font-family: "Baloo 2", "Trebuchet MS", sans-serif; line-height: 1.05; margin: 0; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; user-select: none; }
  .hidden { display: none !important; }

  /* Gotas de lluvia */
  .embers { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .embers i { position: absolute; top: -40px; width: 2px; height: 18px; border-radius: 2px;
    background: linear-gradient(180deg, transparent, rgba(159,232,255,.75));
    animation: fall linear infinite; opacity: 0; }
  @keyframes fall { 0% { transform: translate(0,0); opacity: 0 } 10% { opacity: .7 } 100% { transform: translate(var(--dx), 110vh); opacity: 0 } }

  .shell { position: relative; z-index: 1; width: min(1500px, calc(100% - 32px)); margin: 0 auto; padding: 14px 0 40px; }

  /* Barra superior */
  .topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
  .brand svg { width: 3rem; height: 3rem; flex: none; }
  .brand strong { display: block; font-family: "Baloo 2", sans-serif; font-size: 1.5rem; line-height: 1; }
  .brand small { color: var(--muted); font-size: .8rem; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .nav button, .btn {
    min-height: 3rem; padding: .5rem .9rem; border-radius: 16px; border: 2px solid var(--line);
    background: rgba(255,255,255,.06); font-weight: 800; font-size: 1rem; display: inline-flex; align-items: center; gap: .45rem; justify-content: center;
    transition: transform .12s ease, background .2s, border-color .2s;
  }
  .nav button:active, .btn:active { transform: scale(.96); }
  .nav button.on { background: linear-gradient(135deg, var(--magma), var(--ember)); border-color: transparent; color: #1a0b05; }
  .btn.hot { background: linear-gradient(135deg, var(--magma), var(--lava)); color: #1a0b05; border-color: transparent; }
  .btn.sea { background: rgba(46,196,182,.18); border-color: rgba(46,196,182,.55); }
  .btn.big { min-height: 3.6rem; font-size: 1.15rem; padding: .6rem 1.4rem; }
  .modetabs { width: 100%; margin-left: 0; }
  .modetabs button { flex: 1 1 0; min-height: 3.5rem; font-size: 1.15rem; }
  .langs { display: flex; border: 2px solid var(--line); border-radius: 16px; overflow: hidden; }
  .nav .langs button { min-height: 2.75rem; border: 0; border-radius: 0; padding: .4rem .85rem; border: 0; background: transparent; font-weight: 800; }
  .nav .langs button.on { background: var(--sea); color: #04201d; }

  .card { background: linear-gradient(180deg, rgba(21,53,61,.92), rgba(15,41,48,.92)); border: 2px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .en { display: block; color: #9fe8e0; font-style: italic; font-size: .82em; margin-top: .25em; font-weight: 700; }
  .en::before { content: "🇬🇧 "; font-style: normal; }

  /* ---------- PORTADA ---------- */
  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center; padding: clamp(18px, 3vw, 40px); overflow: hidden; position: relative; }
  .hero h1 { font-size: clamp(2.6rem, 5vw, 4.6rem); letter-spacing: -.01em; }
  .hero h1 span { background: linear-gradient(90deg, var(--lava), var(--magma)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--muted); font-size: 1.15rem; max-width: 36ch; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .tag { padding: .3rem .8rem; border-radius: 99px; background: rgba(255,255,255,.07); border: 1px solid var(--line); font-size: .9rem; font-weight: 700; }
  .scene { width: 100%; height: auto; border-radius: 18px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
  .mode { text-align: left; padding: 22px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--panel); position: relative; overflow: hidden; min-height: 11rem; transition: transform .15s, border-color .2s; }
  .mode:hover { border-color: var(--ember); transform: translateY(-3px); }
  .mode .ico { font-size: 2.6rem; }
  .mode h3 { font-size: 1.55rem; margin: .3rem 0 .2rem; }
  .mode p { margin: 0; color: var(--muted); font-size: .95rem; }
  .mode::after { content: ""; position: absolute; right: -40px; bottom: -40px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(255,90,31,.35), transparent 70%); }
  .mode:nth-child(2)::after { background: radial-gradient(circle, rgba(255,183,3,.3), transparent 70%); }
  .mode:nth-child(3)::after { background: radial-gradient(circle, rgba(46,196,182,.3), transparent 70%); }
  .mode:nth-child(4)::after { background: radial-gradient(circle, rgba(141,110,99,.45), transparent 70%); }
  .mode:nth-child(5)::after { background: radial-gradient(circle, rgba(142,107,214,.4), transparent 70%); }
  .mode:nth-child(6)::after { background: radial-gradient(circle, rgba(63,191,127,.4), transparent 70%); }

  /* Animaciones de la escena */
  .flow { stroke-dasharray: 16 12; animation: flow 1.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .rain line { animation: drop 1s linear infinite; }
  .rain line:nth-child(2n) { animation-delay: .35s; } .rain line:nth-child(3n) { animation-delay: .7s; }
  @keyframes drop { 0% { transform: translateY(-14px); opacity: 0 } 30% { opacity: 1 } 100% { transform: translateY(26px); opacity: 0 } }
  .waves path { animation: wave 3s ease-in-out infinite alternate; }
  @keyframes wave { to { transform: translateX(-18px); } }
  .cloud { animation: driftC 9s ease-in-out infinite alternate; }
  @keyframes driftC { to { transform: translateX(22px); } }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { min-height: 2.6rem; padding: .3rem .9rem; border-radius: 99px; border: 2px solid var(--line); background: rgba(255,255,255,.05); font-weight: 800; font-size: .92rem; }
  .chip.on { background: rgba(255,183,3,.2); border-color: var(--lava); }

  /* ---------- CUESTIONARIO ---------- */
  .quiz { padding: clamp(18px, 2.5vw, 34px); }
  .qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .qtag { font-weight: 800; color: var(--lava); letter-spacing: .04em; font-size: 1rem; }
  .qcount { color: var(--muted); font-weight: 800; }
  .progress { height: 10px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-bottom: 18px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--sea), var(--lava), var(--magma)); transition: width .4s; }
  .question { font-size: clamp(1.6rem, 2.4vw, 2.5rem); font-weight: 800; margin: 0 0 6px; }
  .multi-note { display: inline-block; margin: 6px 0 4px; padding: .25rem .8rem; border-radius: 99px; background: rgba(46,196,182,.18); border: 2px solid var(--sea); font-weight: 800; font-size: .95rem; }
  .hint { margin-top: 10px; padding: 12px 16px; border-radius: 14px; background: rgba(255,183,3,.12); border: 2px dashed rgba(255,183,3,.5); font-size: 1.1rem; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .opt { display: flex; align-items: center; gap: 14px; text-align: left; min-height: 5.2rem; padding: 14px 18px; border-radius: 18px; border: 3px solid var(--line); background: rgba(255,255,255,.05); font-size: clamp(1.1rem, 1.5vw, 1.5rem); font-weight: 700; transition: transform .12s, background .2s, border-color .2s; }
  .opt:active { transform: scale(.98); }
  .opt .let { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 12px; display: grid; place-items: center; font-family: "Baloo 2", sans-serif; font-size: 1.5rem; background: rgba(255,255,255,.1); }
  .opt:nth-child(1) .let { background: #ff5a1f; color: #1a0b05; } .opt:nth-child(2) .let { background: #ffb703; color: #1a0b05; }
  .opt:nth-child(3) .let { background: #2ec4b6; color: #04201d; } .opt:nth-child(4) .let { background: #c084fc; color: #1d0a33; }
  .opt.sel { border-color: var(--sea); background: rgba(46,196,182,.2); }
  .opt.right { border-color: var(--ok); background: rgba(52,211,153,.25); animation: pop .4s; }
  .opt.wrong { border-color: var(--bad); background: rgba(255,77,109,.18); opacity: .7; animation: shake .4s; }
  .opt[disabled] { cursor: default; }
  @keyframes pop { 50% { transform: scale(1.03); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .actions .spacer { flex: 1; }
  .feedback { margin-top: 18px; padding: 16px 20px; border-radius: 18px; font-size: 1.2rem; display: flex; gap: 14px; align-items: flex-start; }
  .feedback .big { font-size: 2.4rem; line-height: 1; }
  .feedback.ok { background: rgba(52,211,153,.16); border: 2px solid var(--ok); }
  .feedback.ko { background: rgba(255,77,109,.14); border: 2px solid var(--bad); }
  .feedback.info { background: rgba(46,196,182,.14); border: 2px solid var(--sea); }
  .feedback b { font-family: "Baloo 2", sans-serif; font-size: 1.5rem; display: block; }

  /* ---------- TARJETAS ---------- */
  .flip-wrap { perspective: 1600px; margin: 6px auto 0; max-width: 1100px; }
  .flip { position: relative; width: 100%; min-height: min(24rem, 55vh); transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,1.4,.5,1); cursor: pointer; }
  .flip.turned { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 28px; padding: clamp(22px, 4vw, 54px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 3px solid var(--line); box-shadow: var(--shadow); }
  .face.front { background: radial-gradient(circle at 20% 0%, rgba(246,195,68,.22), transparent 50%), linear-gradient(160deg, #12343c, #0b1f25); }
  .face.back { transform: rotateY(180deg); background: radial-gradient(circle at 80% 100%, rgba(46,196,182,.28), transparent 50%), linear-gradient(160deg, #0f2a2a, #10201d); }
  .face .label { position: absolute; top: 18px; left: 22px; font-weight: 800; color: var(--muted); font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; }
  .face .txt { font-size: clamp(1.7rem, 3vw, 3rem); font-weight: 800; }
  .face.back .txt { font-size: clamp(1.4rem, 2.4vw, 2.3rem); }
  .face .tap { position: absolute; bottom: 16px; color: var(--muted); font-size: .9rem; }
  .speak { position: absolute; top: 12px; right: 14px; width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 2px solid var(--line); background: rgba(255,255,255,.08); font-size: 1.4rem; }
  .cardnav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
  .cardnav .count { font-family: "Baloo 2", sans-serif; font-size: 1.6rem; min-width: 6ch; text-align: center; }

  /* ---------- IMÁGENES MUDAS ---------- */
  .mudas { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
  .diagram { padding: 12px; }
  .diagram svg { width: 100%; height: auto; max-height: max(340px, calc(100vh - 380px)); display: block; border-radius: 16px; }
  .mk { cursor: pointer; }
  .mk circle.dot { fill: #fff6ec; stroke: #1a0b05; stroke-width: 4; transition: fill .2s; }
  .mk text { font-family: "Baloo 2", sans-serif; font-size: 30px; font-weight: 800; fill: #1a0b05; pointer-events: none; }
  .mk:hover circle.dot { fill: var(--lava); }
  .mk.solved circle.dot { fill: var(--ok); }
  .mk .pulse { fill: none; stroke: #fff6ec; stroke-width: 3; opacity: .7; animation: ring 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .mk.solved .pulse { display: none; }
  @keyframes ring { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(1.7); opacity: 0 } }
  .leader { stroke: #fff6ec; stroke-width: 3; stroke-dasharray: 6 5; opacity: .9; }
  .legend { padding: 16px; }
  .legend h3 { font-size: 1.6rem; margin-bottom: 10px; }
  .legend ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .legend li button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; min-height: 3.2rem; padding: 8px 12px; border-radius: 14px; border: 2px solid var(--line); background: rgba(255,255,255,.04); font-size: 1.1rem; font-weight: 800; }
  .legend .n { flex: none; width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #1a0b05; font-family: "Baloo 2", sans-serif; font-size: 1.3rem; }
  .legend li.solved .n { background: var(--ok); }
  .legend li:not(.solved) .lt { color: var(--muted); letter-spacing: .3em; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs .chip { font-size: .85rem; min-height: 2.4rem; }

  /* ---------- VOCABULARIO ---------- */
  .vocab-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .search { flex: 1; min-width: 240px; min-height: 3.2rem; padding: .4rem 1rem; border-radius: 16px; border: 2px solid var(--line); background: rgba(0,0,0,.25); font-size: 1.1rem; }
  .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 12px; }
  .vcard { position: relative; padding: 16px 16px 14px; border-radius: 18px; border: 2px solid var(--line); background: var(--panel); text-align: left; min-height: 8.2rem; }
  .vcard .emo { font-size: 1.8rem; }
  .vcard .es { font-family: "Baloo 2", sans-serif; font-size: 1.6rem; line-height: 1.05; margin-top: 4px; }
  .vcard .eng { color: #9fe8e0; font-weight: 800; font-size: 1.15rem; margin-top: 4px; }
  .vcard.masked .eng, .vcard.masked-es .es, .vcard.masked .vdef .en { filter: blur(9px); }
  .vcard .speak { width: 2.6rem; height: 2.6rem; font-size: 1.1rem; }
  .vcard { display: flex; flex-direction: column; padding: 0; }
  .vcard .vmain { position: relative; width: 100%; padding: 16px 16px 10px; background: none; border: 0; text-align: left; border-radius: 16px 16px 0 0; }
  .vcard .vdef-btn { align-self: flex-start; margin: 0 12px 12px; min-height: 2.4rem; padding: .25rem .8rem; border-radius: 99px; border: 2px solid rgba(46,196,182,.55); background: rgba(46,196,182,.12); font-weight: 800; font-size: .9rem; }
  .vcard .vdef { margin: 0 12px 14px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.25); border-left: 4px solid var(--sea); font-size: 1rem; line-height: 1.4; }
  .vcard .vdef .en { display: block; margin-top: 6px; color: #9fe8e0; }
  .vcard.open .vdef-btn { background: var(--sea); color: #04201d; border-color: transparent; }
  .vocab-tools .btn.on { background: rgba(46,196,182,.25); border-color: var(--sea); }

  /* ---------- VISU ---------- */
  .mission-intro { display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; margin-bottom: 12px; }
  .mission-intro .rk { font-size: 2.4rem; line-height: 1; }
  .mission-intro h3 { font-size: 1.4rem; margin-bottom: 4px; }
  .mission-intro p { margin: 0; color: var(--muted); font-size: .98rem; }
  .visu { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
  .vphoto { padding: 12px; }
  .vphoto img { width: 100%; max-height: calc(100vh - 260px); min-height: 220px; object-fit: contain; border-radius: 14px; background: #000; display: block; cursor: zoom-in; }
  .vplace { margin: 8px 2px 0; font-weight: 800; }
  .vcredit { margin: 6px 2px 0; color: var(--muted); font-size: .72rem; line-height: 1.3; }
  .vcredit a { color: #9fe8e0; }
  .ask { padding: 18px; }
  .ask h3 { font-size: 1.3rem; margin: 14px 0 8px; }
  .ask-top { display: flex; gap: 8px; flex-wrap: wrap; }
  .vopts { display: grid; gap: 8px; }
  .vopts .opt { min-height: 3.2rem; font-size: 1.02rem; padding: 10px 14px; border-width: 2px; }
  .vans { margin: 0 0 4px; padding: 8px 12px; border-radius: 12px; background: rgba(52,211,153,.14); border: 2px solid var(--ok); font-weight: 800; }
  .ficha { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,.25); border-left: 5px solid var(--lava); display: grid; gap: 6px; }
  .ficha > b { font-family: "Baloo 2", sans-serif; font-size: 1.2rem; }
  .ficha div span { display: inline-block; min-width: 9.5rem; color: var(--muted); font-weight: 800; }
  .think { margin-top: 14px; padding: 12px 16px; border-radius: 14px; background: rgba(46,196,182,.14); border: 2px solid rgba(46,196,182,.55); font-size: 1rem; }
  .score { padding: 40px 16px; text-align: center; }
  .score .big { font-family: "Baloo 2", sans-serif; font-size: clamp(3.5rem, 9vw, 6rem); color: var(--lava); }
  .score p { font-size: 1.3rem; font-weight: 800; }
  .vreview { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .vreview li { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: 12px; border: 2px solid var(--line); }
  .vreview li.ok { border-color: var(--ok); } .vreview li.ko { border-color: var(--bad); }
  .vreview img { width: 72px; height: 52px; object-fit: cover; border-radius: 8px; flex: none; }

  /* ---------- DOSIER ---------- */
  .dsec { padding: clamp(14px, 2vw, 24px); margin-bottom: 16px; }
  .dsec h2 { font-size: 1.7rem; margin-bottom: 8px; } .dsec h3 { font-size: 1.4rem; margin-bottom: 10px; }
  .dsec ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
  .dkey .big { font-size: 1.25rem; font-weight: 800; color: var(--lava); }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .dtab { width: 100%; border-collapse: collapse; font-size: .95rem; }
  .dtab th, .dtab td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  .dtab th { color: var(--lava); font-weight: 800; } .dtab thead th { background: rgba(255,255,255,.06); color: var(--ink); }
  .rwrap { overflow-x: auto; } .rub { min-width: 760px; font-size: .88rem; }
  .fform { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .fform label { display: grid; gap: 4px; font-weight: 800; font-size: .92rem; }
  .fform label:last-of-type { grid-column: 1 / -1; }
  .fform input, .fform select, .fform textarea { min-height: 2.8rem; padding: .4rem .7rem; border-radius: 12px; border: 2px solid var(--line); background: rgba(0,0,0,.25); font-weight: 600; }
  .fform select option { background: #0f2930; }
  .vcard .star { position: absolute; top: 14px; right: 58px; font-size: 1.1rem; }

  /* ---------- MODALES ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(3,10,12,.8); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; }
  .modal { width: min(900px, 100%); max-height: 92vh; overflow: auto; padding: clamp(18px, 3vw, 34px); }
  .modal h2 { font-size: 2rem; margin-bottom: 10px; }
  .muted { color: var(--muted); }

  .float-pts { position: fixed; z-index: 80; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: "Baloo 2", sans-serif; font-size: clamp(3rem, 8vw, 6rem); color: var(--lava); text-shadow: 0 0 30px rgba(31,162,196,.9), 0 4px 0 #0b4a5a; pointer-events: none; animation: floatUp 1.6s ease-out forwards; white-space: nowrap; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6) } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1) } }

  .footer { margin-top: 26px; color: var(--muted); font-size: .85rem; text-align: center; }

      footer: "ES = Spanish · EN = English · ES+EN = both at once", block: "Topic", allUnits: "All units"
    }
  };
  const uiLang = () => (S.lang === "en" ? "en" : "es");
  const t = k => UI[uiLang()][k] || UI.es[k] || k;

  // Texto de contenido según idioma: ES, EN o ambos
  function bi(es, en) {
    if (S.lang === "en") return esc(en || es);
    if (S.lang === "both" && en && en !== es) return esc(es) + `<span class="en">${esc(en)}</span>`;
    return esc(es);
  }
  const blockName = b => { const x = D.bloques[b] || { icon: "📂", es: t("loaded"), en: t("loaded") }; return x.icon + " " + (S.lang === "en" ? x.en : x.es); };

  function applyUI() {
    document.documentElement.lang = uiLang();
    $$("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
    $$("[data-tp]").forEach(el => el.placeholder = t(el.dataset.tp));
    $$("#langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === S.lang));
    if (S.view === "quiz") renderQuiz();
    if (S.view === "cards") { renderBlockChips("cardBlocks", C.blocks, rebuildCards); renderCard(); }
    if (S.view === "mudas") renderMuda();
    if (S.view === "vocab") renderVocab();
    if (S.view === "visu") renderVisu();
    if (S.view === "dosier") renderDosier();
    if (S.view === "quiz") renderBlockChips("quizBlocks", Q.blocks, rebuildQuiz);

  // ---------- Navegación ----------
  function go(view) {
    S.view = view;
    ["home", "quiz", "cards", "mudas", "vocab", "visu", "dosier"].forEach(v => $("#v-" + v).classList.toggle("hidden", v !== view));
    $$("#nav [data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === view));
    applyUI();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  $$("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  $$("#langs button").forEach(b => b.addEventListener("click", () => { S.lang = b.dataset.lang; store.set("lang", S.lang); applyUI(); }));
  $("#btnFull").addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  });

  // Animación de acierto
  function cheer() {
    const el = document.createElement("div");
    el.className = "float-pts";
    el.textContent = "🌊 " + t("right");
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  }

  // ---------- Modal ----------
  function openModal(html) { $("#modal").innerHTML = html; $("#overlay").classList.remove("hidden"); }
  function closeModal() { $("#overlay").classList.add("hidden"); $("#modal").innerHTML = ""; }
  $("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });

  // ---------- Filtros por bloque ----------
  function renderBlockChips(id, set, onChange) {
    const keys = Object.keys(D.bloques).concat(Q.extra.length && id === "quizBlocks" ? ["cargado"] : []);
    $("#" + id).innerHTML = keys.map(k => `<button class="chip ${set.has(k) ? "on" : ""}" data-b="${k}">${blockName(k)}</button>`).join("");
    $$("#" + id + " .chip").forEach(c => c.onclick = () => {
      const k = c.dataset.b;
      if (set.has(k) && set.size > 1) set.delete(k); else set.add(k);
      onChange(); renderBlockChips(id, set, onChange);
    });
  }

  // ---------- CUESTIONARIO ----------
  const Q = { blocks: new Set(Object.keys(D.bloques)), pool: [], pos: 0, order: [], sel: new Set(), tried: new Set(), done: false, hint: false, extra: [] };
  const allQuestions = () => D.preguntas.concat(Q.extra);

  function rebuildQuiz() {
    Q.pool = shuffle(allQuestions().filter(q => Q.blocks.has(q.b)));
    Q.pos = 0; resetQuestion(); renderQuiz();
  }
  function resetQuestion() {
    const q = Q.pool[Q.pos];
    Q.order = q && q.es.o.length ? shuffle(q.es.o.map((_, i) => i)) : [];
    Q.sel = new Set(); Q.tried = new Set(); Q.done = false; Q.hint = false; Q.result = null;
  }
  const L = q => (S.lang === "en" ? q.en : q.es);

  function renderQuiz() {
    const q = Q.pool[Q.pos];
    if (!q) { $("#qText").textContent = t("allDone"); $("#qOpts").innerHTML = ""; return; }
    const open = !q.es.o.length;
    $("#qTag").textContent = blockName(q.b);
    $("#qCount").textContent = `${t("question")} ${Q.pos + 1} ${t("of")} ${Q.pool.length}`;
    $("#qProg").style.width = ((Q.pos + 1) / Q.pool.length * 100) + "%";
    $("#qText").innerHTML = bi(q.es.q, q.en.q);
    $("#qMulti").innerHTML = q.multi ? `<span class="multi-note">${t("multi")}</span>` : open ? `<span class="multi-note">${t("openQ")}</span>` : "";
    $("#qHint").innerHTML = Q.hint && q.es.h ? `<div class="hint">💡 ${bi(q.es.h, q.en.h)}</div>` : "";
    const letters = "ABCD";
    $("#qOpts").innerHTML = Q.order.map((oi, k) => {
      let cls = "";
      if (Q.sel.has(oi)) cls = "sel";
      if (Q.tried.has(oi)) cls = "wrong";
      if (Q.done && q.c.includes(oi)) cls = "right";
      return `<button class="opt ${cls}" data-o="${oi}" ${Q.done || Q.tried.has(oi) ? "disabled" : ""}><span class="let">${letters[k]}</span><span>${bi(q.es.o[oi], q.en.o[oi])}</span></button>`;
    }).join("");
    $$("#qOpts .opt").forEach(b => b.onclick = () => choose(+b.dataset.o));

    let fb = "";
    if (Q.result === "ok") fb = `<div class="feedback ok"><span class="big">🌊</span><div><b>${t("right")}</b>${bi(q.es.w, q.en.w)}</div></div>`;
    else if (Q.result === "ko") fb = `<div class="feedback ko"><span class="big">💥</span><div><b>${q.multi ? t("wrongMulti") : t("wrong")}</b>${t("reboundTxt")}</div></div>`;
    else if (Q.result === "sol") fb = `<div class="feedback info"><span class="big">📘</span><div><b>${t("solution")}</b>${bi(q.es.w, q.en.w)}</div></div>`;
    $("#qFeedback").innerHTML = fb;

    $("#qCheck").classList.toggle("hidden", !q.multi || Q.done);
    $("#qRebound").classList.toggle("hidden", Q.result !== "ko");
    $("#qReveal").classList.toggle("hidden", Q.done || !(Q.result === "ko" || open));
    $("#qHintBtn").classList.toggle("hidden", Q.done || !q.es.h || Q.hint);
    $("#qPrev").disabled = Q.pos === 0;
  }

  function choose(oi) {
    const q = Q.pool[Q.pos];
    if (Q.done) return;
    if (q.multi) { Q.sel.has(oi) ? Q.sel.delete(oi) : Q.sel.add(oi); Q.result = null; renderQuiz(); return; }
    if (q.c.includes(oi)) { Q.done = true; Q.result = "ok"; cheer(); }
    else { Q.tried.add(oi); Q.result = "ko"; }
    renderQuiz();
  }
  $("#qCheck").onclick = () => {
    const q = Q.pool[Q.pos];
    if (!Q.sel.size) return;
    const ok = Q.sel.size === q.c.length && q.c.every(i => Q.sel.has(i));
    if (ok) { Q.done = true; Q.result = "ok"; cheer(); }
    else { Q.result = "ko"; Q.sel = new Set(); }
    renderQuiz();
  };

  $("#qPrev").onclick = () => { if (Q.pos > 0) { Q.pos--; resetQuestion(); renderQuiz(); } };
  $("#qShuffle").onclick = rebuildQuiz;

  // Cargar un CSV exportado de NotebookLM (#, Question, Hint, Option A-D, Correct Answer, Rationale)
  function parseCSV(text) {
    const rows = []; let row = [], cur = "", q = false;
    text = text.replace(/^﻿/, "");
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += ch;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim()));
  }
  $("#csvFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      const rows = parseCSV(txt);
      const head = rows.shift().map(h => h.trim().toLowerCase());
      const col = n => head.indexOf(n);
      const qs = rows.map(r => {
        const opts = ["option a", "option b", "option c", "option d"].map(n => (r[col(n)] || "").trim()).filter(Boolean);
        const letter = ((r[col("correct answer")] || "").trim().match(/^([A-D])[.)]/) || [])[1];
        const es = { q: r[col("question")] || "", h: r[col("hint")] || "", o: opts, w: r[col("rationale")] || r[col("correct answer")] || r[col("hint")] || "" };
        return { b: "cargado", c: letter ? ["ABCD".indexOf(letter)] : [], es, en: es };
      }).filter(q => q.es.q);
      if (!qs.length) throw new Error();
      Q.extra = Q.extra.concat(qs); Q.blocks = new Set(["cargado"]);
      $("#csvStatus").textContent = `✅ ${qs.length} ${t("csvOk")}`;
      renderBlockChips("quizBlocks", Q.blocks, rebuildQuiz); rebuildQuiz();
    }).catch(() => { $("#csvStatus").textContent = "⚠️ " + t("csvErr"); });
    e.target.value = "";
  });

  function moveCard(d) {
    if (!C.pool.length) return;

  const M = { idx: 0, solved: DIAGRAMS.map(() => new Set()) };
  const mLabel = mk => bi(mk.es, mk.en);

  function renderMuda() {
    const d = DIAGRAMS[M.idx], solved = M.solved[M.idx];
    $("#mudaTabs").innerHTML = DIAGRAMS.map((x, i) => `<button class="chip ${i === M.idx ? "on" : ""}" data-i="${i}">${esc(S.lang === "en" ? x.en : x.es)}</button>`).join("");
    $$("#mudaTabs .chip").forEach(c => c.onclick = () => { M.idx = +c.dataset.i; renderMuda(); });
    $("#mudaTitle").textContent = S.lang === "en" ? d.en : d.es;
    const svg = d.svg();
    const marks = d.m.map((mk, i) => {
      const mx = mk.mx ?? mk.x, my = mk.my ?? mk.y;
      const line = (mx !== mk.x || my !== mk.y) ? `<line class="leader" x1="${mx}" y1="${my}" x2="${mk.x}" y2="${mk.y}"/><circle cx="${mk.x}" cy="${mk.y}" r="6" fill="#fff6ec" stroke="#1a0b05" stroke-width="2"/>` : "";
      return `${line}<g class="mk ${solved.has(i) ? "solved" : ""}" data-m="${i}"><circle class="pulse" cx="${mx}" cy="${my}" r="24"/><circle class="dot" cx="${mx}" cy="${my}" r="24"/><text x="${mx}" y="${my + 10}" text-anchor="middle">${i + 1}</text></g>`;
    }).join("");
    $("#mudaSvg").innerHTML = svg.replace("</svg>", marks + "</svg>");
    $$("#mudaSvg .mk").forEach(g => g.addEventListener("click", () => askMarker(+g.dataset.m)));
    $("#mudaLegend").innerHTML = d.m.map((mk, i) => `<li class="${solved.has(i) ? "solved" : ""}"><button data-m="${i}"><span class="n">${i + 1}</span><span class="lt">${solved.has(i) ? mLabel(mk) : "? ? ?"}</span></button></li>`).join("");
    $$("#mudaLegend button").forEach(b => b.onclick = () => askMarker(+b.dataset.m));
  }

  function askMarker(i) {
    const d = DIAGRAMS[M.idx], solved = M.solved[M.idx];
    if (solved.has(i)) return;
    // Opciones: la correcta + hasta 3 de otras partes del mismo dibujo
    const others = shuffle(d.m.map((_, k) => k).filter(k => k !== i)).slice(0, 3);
    const opts = shuffle([i, ...others]);
    const tried = new Set();
    const draw = (state) => {
      openModal(`
        <h2>${t("whatIs")} <span style="display:inline-grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--ink);color:#1a0b05">${i + 1}</span> ?</h2>
        <div class="options">${opts.map((o, k) => `<button class="opt ${tried.has(o) ? "wrong" : ""} ${state === "ok" && o === i ? "right" : ""}" data-o="${o}" ${tried.has(o) || state ? "disabled" : ""}><span class="let">${"ABCD"[k]}</span><span>${mLabel(d.m[o])}</span></button>`).join("")}</div>
        ${state === "ko" ? `<div class="feedback ko"><span class="big">💥</span><div><b>${t("wrong")}</b>${t("reboundTxt")}</div></div>` : ""}
        <div class="actions">
          ${state === "ko" ? `<button class="btn" id="mReb">🔁 ${t("rebound")}</button><button class="btn" id="mSol">👁️ ${t("reveal")}</button>` : ""}
          <span class="spacer" style="flex:1"></span><button class="btn" id="closeM">✖ ${t("close")}</button></div>`);
      $$("#modal .opt").forEach(b => b.onclick = () => {
        const o = +b.dataset.o;
        if (o === i) { solved.add(i); draw("ok"); cheer(); setTimeout(() => { closeModal(); renderMuda(); }, 1300); }
        else { tried.add(o); draw("ko"); }
      });
      $("#closeM").onclick = () => { closeModal(); renderMuda(); };
      if (state === "ko") {
        $("#mReb").onclick = () => askAgain();
        $("#mSol").onclick = () => { solved.add(i); closeModal(); renderMuda(); };
      }
    };
    const askAgain = () => { draw(null); };
    draw(null);
  }
  $("#mudaShow").onclick = () => { DIAGRAMS[M.idx].m.forEach((_, i) => M.solved[M.idx].add(i)); renderMuda(); };
  $("#mudaReset").onclick = () => { M.solved[M.idx] = new Set(); renderMuda(); };

  // ---------- VOCABULARIO ----------
  const V = { hideEn: false, hideEs: false, allDefs: false, star: false, open: new Set() };
  const STAR = new Set(D.imprescindibles || []);
  function renderVocab() {
    const qy = ($("#vSearch").value || "").toLowerCase().trim();
    const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const list = D.vocabulario.filter(v => (!V.star || STAR.has(v[0])) && (!qy || norm(v[0] + " " + v[1]).includes(norm(qy))));
    $("#vGrid").innerHTML = list.map(v => {
      const open = V.allDefs || V.open.has(v[0]);
      return `
      <div class="vcard ${V.hideEn ? "masked" : ""} ${V.hideEs ? "masked-es" : ""} ${open ? "open" : ""}" data-key="${esc(v[0])}">
        <button class="vmain" data-es="${esc(v[0])}" data-en="${esc(v[1])}">
          <span class="speak" aria-hidden="true">🔊</span>${STAR.has(v[0]) ? `<span class="star" title="⭐">⭐</span>` : ""}
          <div class="emo">${v[2]}</div><div class="es">${esc(v[0])}</div><div class="eng">${esc(v[1])}</div></button>
        ${v[3] ? `<button class="vdef-btn" aria-expanded="${open}">📘 ${t(open ? "defHide" : "def")}</button>
        ${open ? `<p class="vdef">${bi(v[3], v[4])}</p>` : ""}` : ""}
      </div>`;
    }).join("");
    $$("#vGrid .vmain").forEach(b => b.onclick = () => {
      const c = b.parentElement;
      if (c.classList.contains("masked") || c.classList.contains("masked-es")) { c.classList.remove("masked", "masked-es"); }
      const u1 = new SpeechSynthesisUtterance(b.dataset.es); u1.lang = "es-ES"; u1.rate = .9;
      const u2 = new SpeechSynthesisUtterance(b.dataset.en); u2.lang = "en-AU"; u2.rate = .9;
      if ("speechSynthesis" in window) { speechSynthesis.cancel(); speechSynthesis.speak(u1); speechSynthesis.speak(u2); }
    });
    $$("#vGrid .vdef-btn").forEach(b => b.onclick = () => {
      const k = b.parentElement.dataset.key;
      if (V.allDefs) { V.allDefs = false; D.vocabulario.forEach(v => V.open.add(v[0])); }
      V.open.has(k) ? V.open.delete(k) : V.open.add(k);
      renderVocab();
    });
    $("#vHideEn").classList.toggle("on", V.hideEn);
    $("#vHideEs").classList.toggle("on", V.hideEs);
    $("#vDefsAll").classList.toggle("on", V.allDefs);
    $("#vStar").classList.toggle("on", V.star);
    $("#vDefsAll span").textContent = t(V.allDefs ? "defsHide" : "defsAll");
  }
  $("#vStar").onclick = () => { V.star = !V.star; renderVocab(); };
  $("#vDefsAll").onclick = () => { V.allDefs = !V.allDefs; V.open.clear(); renderVocab(); };
  $("#vSearch").addEventListener("input", renderVocab);
  $("#vHideEn").onclick = () => { V.hideEn = !V.hideEn; if (V.hideEn) V.hideEs = false; renderVocab(); };
  $("#vHideEs").onclick = () => { V.hideEs = !V.hideEs; if (V.hideEs) V.hideEn = false; renderVocab(); };

  // ---------- VISU: identificar modelados y riesgos en fotos reales ----------
  const AGENTES = {
    agua:   { es: "Aguas superficiales (ríos, torrentes, arroyada)", en: "Running water (rivers, torrents, runoff)" },
    subt:   { es: "Aguas subterráneas", en: "Groundwater" },
    hielo:  { es: "Hielo (glaciares)", en: "Ice (glaciers)" },
    mar:    { es: "El mar", en: "The sea" },
    viento: { es: "El viento", en: "Wind" },
    grav:   { es: "La gravedad", en: "Gravity" }
  };
  const PROCESOS = { ero: { es: "Erosión", en: "Erosion" }, sed: { es: "Sedimentación (depósito)", en: "Deposition" } };
  const MODELADOS = {
    fluvial: { es: "Fluvial", en: "River (fluvial)" }, torrencial: { es: "Torrencial", en: "Torrential" },
    arroyada: { es: "De arroyada", en: "Runoff" }, karst: { es: "Kárstico", en: "Karst" }, glaciar: { es: "Glaciar", en: "Glacial" },
    litoral: { es: "Litoral", en: "Coastal" }, eolico: { es: "Eólico", en: "Wind (aeolian)" }, grav: { es: "Gravitacional", en: "Mass movement" }
  };
  const RIESGOS = {
    inund: { es: "Inundación", en: "Flood" }, grav: { es: "Desprendimiento o deslizamiento", en: "Rockfall or landslide" },
    hund: { es: "Hundimiento del terreno", en: "Ground collapse or subsidence" }, costa: { es: "Erosión costera", en: "Coastal erosion" },
    volcan: { es: "Riesgo volcánico", en: "Volcanic hazard" }, sismo: { es: "Riesgo sísmico", en: "Earthquake hazard" },
    desert: { es: "Desertificación y avance de dunas", en: "Desertification and moving dunes" }
  };
  const VITEMS = VD.items || [];
  const byTipo = tp => VITEMS.filter(x => x.tipo === tp);
  const lbl = o => bi(o.es, o.en);
  const VU = { mode: "modelado", order: { modelado: [], riesgo: [] }, pos: { modelado: 0, riesgo: 0 }, st: {}, exam: null };

  function vuOrder(tp) { VU.order[tp] = shuffle(byTipo(tp).map(x => x.id)); VU.pos[tp] = 0; }
  const vuItem = id => VITEMS.find(x => x.id === id);

  // Opciones de "forma": la correcta + distractores (preferentemente del mismo agente)
  function formaOpts(it, n = 4) {
    const others = VITEMS.filter(x => x.tipo === "modelado" && x.forma.es !== it.forma.es);
    const uniq = []; others.forEach(x => { if (!uniq.some(u => u.forma.es === x.forma.es)) uniq.push(x); });
    const same = shuffle(uniq.filter(x => x.agente === it.agente)).slice(0, 2);
    const rest = shuffle(uniq.filter(x => !same.includes(x))).slice(0, n - 1 - same.length);
    return shuffle([it, ...same, ...rest]).map(x => ({ v: x.forma.es, l: x.forma }));
  }
  function steps(it) {
    if (it.tipo === "riesgo") {
      const others = shuffle(byTipo("riesgo").filter(x => x.riesgo !== it.riesgo));
      const meds = [];
      others.forEach(x => { if (meds.length < 2 && !meds.some(m => m.es === x.medida.es)) meds.push(x.medida); });
      return [
        { k: "riesgo", q: t("vuQRiesgo"), ok: it.riesgo,
          o: shuffle(Object.keys(RIESGOS)).map(k => ({ v: k, l: RIESGOS[k] })) },
        { k: "medida", q: t("vuQMedida"), ok: it.medida.es,
          o: shuffle([it.medida, ...meds]).map(m => ({ v: m.es, l: m })) }
      ];
    }
    const s = [
      { k: "agente", q: t("vuQAgente"), ok: it.agente, o: Object.keys(AGENTES).map(k => ({ v: k, l: AGENTES[k] })) },
      { k: "forma", q: t("vuQForma"), ok: it.forma.es, o: formaOpts(it) }
    ];
    if (it.proceso) s.push({ k: "proceso", q: t("vuQProceso"), ok: it.proceso, o: Object.keys(PROCESOS).map(k => ({ v: k, l: PROCESOS[k] })) });
    return s;
  }
  function vuState(it) {
    if (!VU.st[it.id]) VU.st[it.id] = { steps: steps(it), cur: 0, wrong: {}, done: false, shown: false };
    return VU.st[it.id];
  }

  function photoHTML(it, showPlace) {
    const c = it.credit || {};
    return `<img src="${esc(it.img)}" alt="${esc(t("vuAlt"))}" id="vuImg">
      ${showPlace && it.lugar ? `<p class="vplace">📍 ${bi(it.lugar.es, it.lugar.en)}</p>` : ""}
      <p class="vcredit">📷 ${esc(c.autor || "")} · ${esc(c.lic || "")} · <a href="${esc(c.url || "#")}" target="_blank" rel="noopener">Wikimedia Commons</a></p>`;
  }
  function bindZoom(it) {
    const im = $("#vuImg"); if (!im) return;
    im.onclick = () => {
      openModal(`<img src="${esc(it.img)}" style="width:100%;border-radius:14px" alt=""><div class="actions"><span class="spacer" style="flex:1"></span><button class="btn" id="closeM">✖ ${t("close")}</button></div>`);
      $("#closeM").onclick = closeModal;
    };
  }

  function renderVisu() {
    $("#vuTabs").innerHTML = [["modelado", "🏞️ " + t("vuTabMod")], ["riesgo", "⚠️ " + t("vuTabRies")], ["examen", "⏱️ " + t("vuTabExam")]]
      .map(([k, l]) => `<button class="chip ${VU.mode === k ? "on" : ""}" data-k="${k}">${l}</button>`).join("");
    $$("#vuTabs .chip").forEach(c => c.onclick = () => { VU.mode = c.dataset.k; renderVisu(); });
    if (!VITEMS.length) { $("#vuPhoto").innerHTML = ""; $("#vuAsk").innerHTML = `<p>${t("vuEmpty")}</p>`; return; }
    if (VU.mode === "examen") return renderExam();
    const tp = VU.mode;
    if (!VU.order[tp].length) vuOrder(tp);
    const it = vuItem(VU.order[tp][VU.pos[tp]]), st = vuState(it);
    $("#vuPhoto").innerHTML = photoHTML(it, st.done);
    bindZoom(it);

    let h = `<div class="qhead"><span class="qtag">${t("vuPhoto")} ${VU.pos[tp] + 1} ${t("of")} ${VU.order[tp].length}</span>
      <span class="ask-top"><button class="btn" id="vuPrev">◀</button><button class="btn" id="vuShuf">🔀</button></span></div>`;
    st.steps.forEach((s, i) => {
      if (i > st.cur && !st.done) return;
      const solved = st.done || i < st.cur;
      h += `<h3>${i + 1}. ${solved ? "✅ " : ""}${esc(s.q)}</h3>`;
      if (solved) { const r = s.o.find(o => o.v === s.ok); h += `<p class="vans">${lbl(r.l)}</p>`; return; }
      const wrong = st.wrong[i] || [];
      h += `<div class="vopts">${s.o.map(o => `<button class="opt ${wrong.includes(o.v) ? "wrong" : ""}" data-i="${i}" data-v="${esc(o.v)}" ${wrong.includes(o.v) ? "disabled" : ""}><span>${lbl(o.l)}</span></button>`).join("")}</div>`;
      if (wrong.length) h += `<div class="feedback ko"><span class="big">🔍</span><div>${t("vuTryAgain")}</div></div>`;
    });
    if (st.done) {
      h += `<div class="ficha"><b>📋 ${t("vuFicha")}</b>`;
      if (it.tipo === "modelado") {
        h += `<div><span>${t("vuAgente")}</span>${lbl(AGENTES[it.agente])}</div>
              <div><span>${t("vuForma")}</span>${lbl(it.forma)}</div>
              ${it.proceso ? `<div><span>${t("vuProceso")}</span>${lbl(PROCESOS[it.proceso])}</div>` : ""}
              <div><span>${t("vuModelado")}</span>${lbl(MODELADOS[it.modelado])}</div>`;
      } else {
        h += `<div><span>${t("vuRiesgo")}</span>${lbl(RIESGOS[it.riesgo])}</div><div><span>${t("vuMedida")}</span>${lbl(it.medida)}</div>`;
      }
      h += `</div><div class="think">💡 ${bi(it.nota.es, it.nota.en)}</div>`;
      h += `<div class="actions"><span class="spacer"></span><button class="btn hot big" id="vuNext">${t("vuNext")} ▶</button></div>`;
    } else {
      h += `<div class="actions"><button class="btn" id="vuSol">👁️ ${t("reveal")}</button><span class="spacer"></span><button class="btn" id="vuSkip">${t("vuNext")} ▶</button></div>`;
    }
    $("#vuAsk").innerHTML = h;

    $$("#vuAsk .vopts .opt").forEach(b => b.onclick = () => {
      const i = +b.dataset.i, v = b.dataset.v, s = st.steps[i];
      if (v === s.ok) { st.cur = i + 1; if (st.cur >= st.steps.length) { st.done = true; cheer(); } }
      else (st.wrong[i] = st.wrong[i] || []).push(v);
      renderVisu();
    });
    const move = d => { VU.pos[tp] = (VU.pos[tp] + d + VU.order[tp].length) % VU.order[tp].length; renderVisu(); };
    if ($("#vuNext")) $("#vuNext").onclick = () => move(1);
    if ($("#vuSkip")) $("#vuSkip").onclick = () => move(1);
    $("#vuPrev").onclick = () => move(-1);
    $("#vuShuf").onclick = () => { vuOrder(tp); renderVisu(); };
    if ($("#vuSol")) $("#vuSol").onclick = () => { st.done = true; st.cur = st.steps.length; renderVisu(); };
  }

  // Examen visu: 10 fotos al azar, una sola oportunidad por foto
  function newExam() {
    const pool = shuffle(VITEMS.filter(x => x.tipo === "modelado")).slice(0, 10);
    VU.exam = { ids: pool.map(x => x.id), opts: pool.map(x => formaOpts(x)), ans: [], pos: 0 };
  }
  function renderExam() {
    if (!VU.exam) newExam();
    const E = VU.exam;
    if (E.pos >= E.ids.length) {
      const ok = E.ans.filter((a, i) => a === vuItem(E.ids[i]).forma.es).length;
      $("#vuPhoto").innerHTML = `<div class="score"><div class="big">${ok} / ${E.ids.length}</div><p>${t(ok >= 8 ? "vuGreat" : ok >= 5 ? "vuGood" : "vuMore")}</p></div>`;
      $("#vuAsk").innerHTML = `<h3>${t("vuReview")}</h3><ol class="vreview">${E.ids.map((id, i) => {
        const it = vuItem(id), good = E.ans[i] === it.forma.es;
        return `<li class="${good ? "ok" : "ko"}"><img src="${esc(it.img)}" alt=""><span>${good ? "✅" : "❌"} ${lbl(it.forma)}</span></li>`;
      }).join("")}</ol><div class="actions"><span class="spacer"></span><button class="btn hot big" id="vuAgain">🔁 ${t("vuAgain")}</button></div>`;
      $("#vuAgain").onclick = () => { newExam(); renderVisu(); };
      return;
    }
    const it = vuItem(E.ids[E.pos]), answered = E.ans[E.pos] !== undefined;
    $("#vuPhoto").innerHTML = photoHTML(it, answered);
    bindZoom(it);
    let h = `<div class="qhead"><span class="qtag">⏱️ ${t("vuTabExam")}</span><span class="qcount">${E.pos + 1} / ${E.ids.length}</span></div>
      <div class="progress"><i style="width:${(E.pos + (answered ? 1 : 0)) / E.ids.length * 100}%"></i></div>
      <h3>${t("vuQExam")}</h3>
      <div class="vopts">${E.opts[E.pos].map(o => {
        let cls = "";
        if (answered && o.v === it.forma.es) cls = "right";
        else if (answered && o.v === E.ans[E.pos]) cls = "wrong";
        return `<button class="opt ${cls}" data-v="${esc(o.v)}" ${answered ? "disabled" : ""}><span>${lbl(o.l)}</span></button>`;
      }).join("")}</div>`;
    if (answered) h += `<div class="think">💡 ${bi(it.nota.es, it.nota.en)}</div><div class="actions"><span class="spacer"></span><button class="btn hot big" id="vuExNext">${t("next")} ▶</button></div>`;
    $("#vuAsk").innerHTML = h;
    $$("#vuAsk .opt").forEach(b => b.onclick = () => { E.ans[E.pos] = b.dataset.v; if (b.dataset.v === it.forma.es) cheer(); renderVisu(); });
    if ($("#vuExNext")) $("#vuExNext").onclick = () => { E.pos++; renderVisu(); };
  }

  // ---------- DOSIER: guía, ficha rellenable y rúbrica ----------
  const DOS = D.dosier;
  const FICHA_CAMPOS = [
    { k: "titulo", t: "text" }, { k: "lugar", t: "text" }, { k: "foto", t: "text" },
    { k: "agente", t: "select", o: () => Object.keys(AGENTES).map(x => AGENTES[x]) },
    { k: "forma", t: "text", list: true }, { k: "proceso", t: "select", o: () => [{ es: "Erosión", en: "Erosion" }, { es: "Transporte", en: "Transport" }, { es: "Sedimentación", en: "Deposition" }] },
    { k: "modelado", t: "select", o: () => Object.keys(MODELADOS).map(x => MODELADOS[x]) },
    { k: "riesgo", t: "text" },
    { k: "tipoMedida", t: "select", o: () => [{ es: "Previsión", en: "Risk assessment" }, { es: "Prevención", en: "Prevention" }, { es: "Predicción", en: "Prediction" }] },
    { k: "medida", t: "text" }, { k: "explica", t: "area" }
  ];
  let ficha = store.get("ficha", {});
  const L2 = o => (S.lang === "en" ? o.en : o.es);

  function fichaTexto() {
    return FICHA_CAMPOS.map(c => `${t("f_" + c.k)}: ${ficha[c.k] || ""}`).join("\n");
  }

  function renderDosier() {
    if (!DOS) return;
    const formas = [...new Set(VITEMS.filter(x => x.tipo === "modelado").map(x => L2(x.forma)))].sort();
    let h = `<div class="card dsec dkey"><h2>🔑 ${t("dIdea")}</h2><p class="big">${bi(DOS.idea.es, DOS.idea.en)}</p><p>${bi(DOS.tarea.es, DOS.tarea.en)}</p></div>`;

    h += `<div class="dgrid"><div class="card dsec"><h3>✅ ${t("dReq")}</h3><ul>${DOS.requisitos.map(r => `<li>${bi(r.es, r.en)}</li>`).join("")}</ul></div>
      <div class="card dsec"><h3>📅 ${t("dPlazos")}</h3><table class="dtab"><tbody>${DOS.plazos.map(p => `<tr><th>${bi(p.f.es, p.f.en)}</th><td><b>${bi(p.q.es, p.q.en)}</b><br>${bi(p.d.es, p.d.en)}</td></tr>`).join("")}</tbody></table></div></div>`;

    // Ficha rellenable
    h += `<div class="card dsec" id="fichaBox"><h3>📝 ${t("dFicha")}</h3><p class="muted">${t("dFichaHelp")}</p><div class="fform">`;
    FICHA_CAMPOS.forEach(c => {
      const v = esc(ficha[c.k] || "");
      h += `<label><span>${t("f_" + c.k)}</span>`;
      if (c.t === "select") h += `<select data-k="${c.k}"><option value="">—</option>${c.o().map(o => `<option ${ficha[c.k] === L2(o) ? "selected" : ""}>${esc(L2(o))}</option>`).join("")}</select>`;
      else if (c.t === "area") h += `<textarea data-k="${c.k}" rows="3">${v}</textarea>`;
      else h += `<input data-k="${c.k}" value="${v}" ${c.list ? 'list="formasList"' : ""}>`;
      h += `</label>`;
    });
    h += `<datalist id="formasList">${formas.map(f => `<option value="${esc(f)}">`).join("")}</datalist></div>
      <div class="actions"><button class="btn sea" id="fCopy">📋 ${t("dCopy")}</button><button class="btn" id="fPrint">🖨️ ${t("dPrint")}</button><button class="btn" id="fNew">🧹 ${t("dNew")}</button><span class="muted" id="fMsg" style="align-self:center"></span></div></div>`;

    // Ejemplo y ayuda
    h += `<div class="dgrid"><div class="card dsec"><h3>⭐ ${t("dEjemplo")}</h3><table class="dtab"><tbody>${DOS.ejemplo.map(([a, b]) => `<tr><th>${bi(a.es, a.en)}</th><td>${bi(b.es, b.en)}</td></tr>`).join("")}</tbody></table></div>
      <div class="card dsec"><h3>🧭 ${t("dAyuda")}</h3><table class="dtab"><thead><tr><th>${t("vuAgente")}</th><th>${t("dFormas")}</th><th>${t("vuRiesgo")}</th></tr></thead><tbody>${DOS.ayuda.map(r => `<tr><th>${bi(r.a.es, r.a.en)}</th><td>${bi(r.f.es, r.f.en)}</td><td>${bi(r.r.es, r.r.en)}</td></tr>`).join("")}</tbody></table></div></div>`;

    // Rúbrica
    const R = DOS.rubrica;
    h += `<div class="card dsec"><h3>🎯 ${t("dRubrica")}</h3><div class="rwrap"><table class="dtab rub"><thead><tr><th></th>${R.niveles.map(n => `<th>${bi(n.es, n.en)}</th>`).join("")}</tr></thead>
      <tbody>${R.filas.map(f => `<tr><th>${bi(f.c.es, f.c.en)}</th>${f.n.map(n => `<td>${bi(n.es, n.en)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    $("#dosRoot").innerHTML = h;

    $$("#fichaBox [data-k]").forEach(el => el.addEventListener("input", () => { ficha[el.dataset.k] = el.value; store.set("ficha", ficha); }));
    $("#fCopy").onclick = () => {
      const done = () => { $("#fMsg").textContent = "✅ " + t("dCopied"); };
      if (navigator.clipboard) navigator.clipboard.writeText(fichaTexto()).then(done, () => { $("#fMsg").textContent = fichaTexto(); });
      else $("#fMsg").textContent = fichaTexto();
    };
    $("#fPrint").onclick = () => {
      const w = window.open("", "_blank"); if (!w) return;
      const rows = FICHA_CAMPOS.map(c => `<tr><th>${esc(t("f_" + c.k))}</th><td>${esc(ficha[c.k] || "")}</td></tr>`).join("");
      w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(t("dFicha"))}</title><style>body{font:14px Arial;margin:24px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:8px;text-align:left;vertical-align:top}th{width:30%;background:#e7f4ef}</style><h2>${esc(t("dFicha"))}</h2><table>${rows}</table>`);
      w.document.close(); w.focus(); w.print();
    };
    $("#fNew").onclick = () => { ficha = {}; store.set("ficha", ficha); renderDosier(); };
  }

  // ---------- Lluvia decorativa ----------
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) {
    const box = $("#embers");
    for (let i = 0; i < 26; i++) {
      const e = document.createElement("i");
      e.style.left = Math.random() * 100 + "%";
      e.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      e.style.animationDuration = (9 + Math.random() * 12) + "s";
      e.style.animationDelay = (-Math.random() * 20) + "s";
      e.style.height = (12 + Math.random() * 14) + "px";
      box.appendChild(e);
    }
  }

  // ---------- Inicio ----------
  rebuildQuiz();
  rebuildCards();
  // Enlaces directos: #quiz, #cards, #vocab, #visu, #visu-riesgo, #visu-examen, #mudas o #mudas-3 (uno concreto)
  const [hv, hn] = location.hash.slice(1).split("-");
  if (hv === "mudas" && DIAGRAMS[+hn]) M.idx = +hn;
  if (hv === "visu" && ["modelado", "riesgo", "examen"].includes(hn)) VU.mode = hn;
  go(["quiz", "cards", "mudas", "vocab", "visu", "dosier"].includes(hv) ? hv : "home");
})();
</script>
</body>
</html>
